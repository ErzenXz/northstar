name: northstar

x-northstar-env: &northstar-env
  DATABASE_URL: postgresql://northstar:northstar@postgres:5432/northstar
  NORTHSTAR_REPOSITORY_ROOT: /var/lib/northstar/repositories
  NORTHSTAR_ASSET_ROOT: /var/lib/northstar/assets
  NORTHSTAR_SANDBOX_ROOT: /var/lib/northstar/sandboxes
  NORTHSTAR_BACKUP_ROOT: /var/lib/northstar/backups
  NORTHSTAR_BASE_URL: http://localhost:3000
  NORTHSTAR_GIT_URL: http://localhost:4000
  NORTHSTAR_SSH_URL: ssh://git@localhost:2222
  NORTHSTAR_EDITION: community
  NORTHSTAR_ENCRYPTION_KEY: ${NORTHSTAR_ENCRYPTION_KEY:-local-encryption-key-change-before-public-use}
  SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-before-public-use}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-openai/gpt-5.6-terra}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
    ports:
      - "54321:5432"
    volumes:
      - northstar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment: *northstar-env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment: *northstar-env
    ports:
      - "3000:3000"
    volumes:
      - northstar-repositories:/var/lib/northstar/repositories
    depends_on:
      migrate:
        condition: service_completed_successfully

  git:
    build:
      context: .
      target: git
    environment:
      <<: *northstar-env
      GIT_PORT: 4000
      GIT_HOST: 0.0.0.0
    ports:
      - "4000:4000"
    volumes:
      - northstar-repositories:/var/lib/northstar/repositories
    depends_on:
      migrate:
        condition: service_completed_successfully

  ssh:
    build:
      context: .
      target: ssh
    environment:
      <<: *northstar-env
      NORTHSTAR_SSH_HOST: 0.0.0.0
      NORTHSTAR_SSH_PORT: 2222
      NORTHSTAR_SSH_HOST_KEY: /var/lib/northstar/ssh/host-key.pem
    ports:
      - "2222:2222"
    volumes:
      - northstar-repositories:/var/lib/northstar/repositories
      - northstar-ssh:/var/lib/northstar/ssh
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment: *northstar-env
    volumes:
      - northstar-repositories:/var/lib/northstar/repositories
      - northstar-assets:/var/lib/northstar/assets
      - northstar-backups:/var/lib/northstar/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    profiles: ["demo"]
    build:
      context: .
      target: seed
    environment: *northstar-env
    volumes:
      - northstar-repositories:/var/lib/northstar/repositories
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  northstar-postgres:
  northstar-repositories:
  northstar-assets:
  northstar-backups:
  northstar-ssh:
