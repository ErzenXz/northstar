name: origin

x-origin-env: &origin-env
  DATABASE_URL: postgresql://origin:origin@postgres:5432/origin
  ORIGIN_REPOSITORY_ROOT: /var/lib/origin/repositories
  ORIGIN_ASSET_ROOT: /var/lib/origin/assets
  ORIGIN_BASE_URL: http://localhost:3000
  ORIGIN_GIT_URL: http://localhost:4000
  ORIGIN_SSH_URL: ssh://git@localhost:2222
  ORIGIN_EDITION: community
  ORIGIN_ENCRYPTION_KEY: ${ORIGIN_ENCRYPTION_KEY:-local-encryption-key-change-before-public-use}
  SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-before-public-use}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-openai/gpt-5.6-terra}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: origin
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: origin
    ports:
      - "54321:5432"
    volumes:
      - origin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin -d origin"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment: *origin-env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment: *origin-env
    ports:
      - "3000:3000"
    volumes:
      - origin-repositories:/var/lib/origin/repositories
    depends_on:
      migrate:
        condition: service_completed_successfully

  git:
    build:
      context: .
      target: git
    environment:
      <<: *origin-env
      GIT_PORT: 4000
      GIT_HOST: 0.0.0.0
    ports:
      - "4000:4000"
    volumes:
      - origin-repositories:/var/lib/origin/repositories
    depends_on:
      migrate:
        condition: service_completed_successfully

  ssh:
    build:
      context: .
      target: ssh
    environment:
      <<: *origin-env
      ORIGIN_SSH_HOST: 0.0.0.0
      ORIGIN_SSH_PORT: 2222
      ORIGIN_SSH_HOST_KEY: /var/lib/origin/ssh/host-key.pem
    ports:
      - "2222:2222"
    volumes:
      - origin-repositories:/var/lib/origin/repositories
      - origin-ssh:/var/lib/origin/ssh
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment: *origin-env
    volumes:
      - origin-repositories:/var/lib/origin/repositories
      - origin-assets:/var/lib/origin/assets
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    profiles: ["demo"]
    build:
      context: .
      target: seed
    environment: *origin-env
    volumes:
      - origin-repositories:/var/lib/origin/repositories
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  origin-postgres:
  origin-repositories:
  origin-assets:
  origin-ssh:
